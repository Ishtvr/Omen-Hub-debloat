[package]
name = "omen-hub-plus-plus"
version.workspace = true
edition.workspace = true
rust-version = "1.92"

[[bin]]
name = "omen-hub-pp"
path = "src/main.rs"

[dependencies]
omen-core.workspace = true
omen-platform.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "renderer-femtovg", "accessibility", "compat-1-18", "unstable-winit-030"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_Globalization", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.1"
