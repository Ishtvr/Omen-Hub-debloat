[package]
name = "omen-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
omen-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
quick-xml = "0.38"

[build-dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"
libloading = "0.8"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_TaskScheduler"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_UI_Shell"] }
