[workspace]
members = ["crates/core", "crates/platform", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omen-core = { path = "crates/core" }
omen-platform = { path = "crates/platform" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
